# ------------------------------------------------------------
# PIPELINE CHAIN (auto-detected from workflow triggers)
# Batch Motors → Property Rent → Property Sale → Jobs → Classifieds & Community   (daily at 00:00 UTC)
# ------------------------------------------------------------
pipeline_chain:
  - batch: "Motors"
    trigger: "cron: '0 0 * * *'"
    triggers_next: "Property Rent"
  - batch: "Property Rent"
    trigger: "on_completion: Motors"
    triggers_next: "Property Sale"
  - batch: "Property Sale"
    trigger: "on_completion: Property Rent"
    triggers_next: "Jobs"
  - batch: "Jobs"
    trigger: "on_completion: Property Sale"
    triggers_next: "Classifieds_Community"
  - batch: "Classifieds_Community"
    trigger: "workflow_dispatch (triggered by Jobs)"
    triggers_next: null

