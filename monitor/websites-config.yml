# ── PER-SCRAPER SCHEMAS ──────────────────────────────────────
excel_schema:

  # ── BATCH Motors ─────────────────────────────────────────────────

  - scraper: used_cars
    excel_file_pattern: "{brand_name}.xlsx"
    sheets:
      - name: "{car_type}"
        required_columns: *col_sale_cars_listing
        row_count_range: [1, 1]
    min_file_size_kb: 5

