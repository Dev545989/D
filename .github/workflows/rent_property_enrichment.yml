name: Rent Property Phone & Description Enrichment

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD), default is yesterday UTC'
        required: false
        default: ''

jobs:
  # ==========================================
  # PHASE 1: PROFILES ENRICHMENT
  # ==========================================
  prepare_profiles:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      total_jobs: ${{ steps.set-matrix.outputs.total_jobs }}
      has_jobs: ${{ steps.set-matrix.outputs.has_jobs }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl boto3 python-dotenv

      - name: Prepare Profiles Jobs
        id: set-matrix
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python r2_property_enrichment.py prepare \
            ${{ inputs.target_date && format('--date {0}', inputs.target_date) || '' }} \
            --out work_profiles \
            --categories "rent" \
            --job-type profile

          if [ -f "work_profiles/manifest.json" ]; then
            TOTAL_JOBS=$(jq '.total_jobs' work_profiles/manifest.json)
            echo "total_jobs=$TOTAL_JOBS" >> "$GITHUB_OUTPUT"
            if [ "$TOTAL_JOBS" -gt 0 ]; then
              echo "has_jobs=true" >> "$GITHUB_OUTPUT"
              echo "matrix=$(jq -c '{job_file: .jobs}' work_profiles/manifest.json)" >> "$GITHUB_OUTPUT"
            else
              echo "has_jobs=false" >> "$GITHUB_OUTPUT"
              echo 'matrix={"job_file":[]}' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"job_file":[]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload prepare profiles artifact
        if: steps.set-matrix.outputs.has_jobs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rent-profiles-work
          path: work_profiles/
          retention-days: 1

  scrape_profiles:
    needs: prepare_profiles
    if: needs.prepare_profiles.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare_profiles.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Camoufox
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox

      - name: Install dependencies
        run: |
          pip install camoufox pandas openpyxl boto3 python-dotenv
          camoufox fetch

      - name: Download profiles work artifact
        uses: actions/download-artifact@v4
        with:
          name: rent-profiles-work
          path: work_profiles/

      - name: Scrape Profiles
        run: |
          JOB_FILE="work_profiles/${{ matrix.job_file }}"
          JOB_NAME=$(basename "${{ matrix.job_file }}" .json)
          mkdir -p work_profiles/results
          python r2_property_enrichment.py scrape --job "$JOB_FILE" --output "work_profiles/results/result_${JOB_NAME}.json"

      - name: Upload profile result artifact
        uses: actions/upload-artifact@v4
        with:
          name: rent-profile-result-${{ strategy.job-index }}
          path: work_profiles/results/
          retention-days: 1

  combine_profiles:
    needs: [prepare_profiles, scrape_profiles]
    if: needs.prepare_profiles.outputs.has_jobs == 'true' && always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl boto3 python-dotenv

      - name: Download profiles work artifact
        uses: actions/download-artifact@v4
        with:
          name: rent-profiles-work
          path: work_profiles/

      - name: Download profile results
        uses: actions/download-artifact@v4
        with:
          pattern: rent-profile-result-*
          path: work_profiles/results/
          merge-multiple: true

      - name: Combine profiles & update profiles-data.xlsx on R2
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python r2_property_enrichment.py combine-profiles \
            --work work_profiles \
            ${{ inputs.target_date && format('--date {0}', inputs.target_date) || '' }}

  # ==========================================
  # PHASE 2: DESCRIPTIONS ENRICHMENT
  # ==========================================
  prepare_descriptions:
    needs: combine_profiles
    if: always()
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      total_jobs: ${{ steps.set-matrix.outputs.total_jobs }}
      has_jobs: ${{ steps.set-matrix.outputs.has_jobs }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl boto3 python-dotenv

      - name: Prepare Descriptions Jobs (Re-checking against updated profiles)
        id: set-matrix
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python r2_property_enrichment.py prepare \
            ${{ inputs.target_date && format('--date {0}', inputs.target_date) || '' }} \
            --out work_desc \
            --categories "rent" \
            --job-type description

          if [ -f "work_desc/manifest.json" ]; then
            TOTAL_JOBS=$(jq '.total_jobs' work_desc/manifest.json)
            echo "total_jobs=$TOTAL_JOBS" >> "$GITHUB_OUTPUT"
            if [ "$TOTAL_JOBS" -gt 0 ]; then
              echo "has_jobs=true" >> "$GITHUB_OUTPUT"
              echo "matrix=$(jq -c '{job_file: .jobs}' work_desc/manifest.json)" >> "$GITHUB_OUTPUT"
            else
              echo "has_jobs=false" >> "$GITHUB_OUTPUT"
              echo 'matrix={"job_file":[]}' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"job_file":[]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload prepare descriptions artifact
        if: steps.set-matrix.outputs.has_jobs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rent-desc-work
          path: work_desc/
          retention-days: 1

  scrape_descriptions:
    needs: prepare_descriptions
    if: needs.prepare_descriptions.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare_descriptions.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Camoufox
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox

      - name: Install dependencies
        run: |
          pip install camoufox pandas openpyxl boto3 python-dotenv
          camoufox fetch

      - name: Download desc work artifact
        uses: actions/download-artifact@v4
        with:
          name: rent-desc-work
          path: work_desc/

      - name: Scrape Descriptions
        run: |
          JOB_FILE="work_desc/${{ matrix.job_file }}"
          JOB_NAME=$(basename "${{ matrix.job_file }}" .json)
          mkdir -p work_desc/results
          python r2_property_enrichment.py scrape --job "$JOB_FILE" --output "work_desc/results/result_${JOB_NAME}.json"

      - name: Upload desc result artifact
        uses: actions/upload-artifact@v4
        with:
          name: rent-desc-result-${{ strategy.job-index }}
          path: work_desc/results/
          retention-days: 1

  combine_all:
    needs: [prepare_descriptions, scrape_descriptions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl boto3 python-dotenv

      - name: Download desc work artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rent-desc-work
          path: work_desc/

      - name: Download desc results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rent-desc-result-*
          path: work_desc/results/
          merge-multiple: true

      - name: Combine descriptions & update final files on R2
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python r2_property_enrichment.py combine \
            --work work_desc \
            ${{ inputs.target_date && format('--date {0}', inputs.target_date) || '' }}