name: Rent Property

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  detect_pages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Detect pages and build matrix
        id: build_matrix
        run: |
          python << 'EOF'
          import json
          import os
          import requests

          URL = "https://wd0ptz13zs-dsn.algolia.net/1/indexes/*/queries"
          PARAMS = {
              "x-algolia-agent": "Algolia for JavaScript (4.24.0); Browser (lite)",
              "x-algolia-api-key": "cdd839b4fdac840289e88633779e8634",
              "x-algolia-application-id": "WD0PTZ13ZS",
          }

          CATEGORIES = {
                "rent_residential": {
                    "index": "property-for-rent-residential.com",
                    "filter": '("category_v2.slug_paths":"property-for-rent/residential")',
                    "hits": []
                },
                "rent_rooms_rent_flatmates": {
                    "index": "property-for-rent-rooms-for-rent-flatmates.com",
                    "filter": '("category_v2.slug_paths":"property-for-rent/rooms-for-rent-flatmates")',
                    "hits": []
                }, 
                "rent_commercial": {
                    "index": "property-for-rent-commercial.com",
                    "filter": '("category_v2.slug_paths":"property-for-rent/commercial")',
                    "hits": []
                },
                "rent_holiday_homes": {
                    "index": "property-for-rent-holiday-homes.com",
                    "filter": '("categories.slug_paths":"property-for-rent/holiday-homes")',
                    "hits": []
                },
                "rent_short_term_monthly": {
                    "index": "property-for-rent-short-term.com",
                    "filter": '("categories_v2.slug_paths":"property-for-rent/short-term")',
                    "hits": []
                },
                "rent_short_term_daily": {
                    "index": "property-for-rent-short-term-daily.com",
                    "filter": '("category_v2.slug_paths":"property-for-rent/short-term-daily")',
                    "hits": []
                }              
                
          }

          PAGES_PER_JOB = 50

          matrix = {"include": []}

          for category_name, category in CATEGORIES.items():
              print(f"Detecting pages for {category_name}...")
              try:
                  payload = {
                      "requests": [{
                          "indexName": category["index"],
                          "query": "",
                          "params": f"page=0&hitsPerPage=35&filters={category['filter']}",
                      }]
                  }
                  r = requests.post(URL, params=PARAMS, json=payload, timeout=30)
                  data = r.json()
                  nb_pages = data["results"][0]["nbPages"]
                  nb_pages = 20 
                  print(f"  {category_name}: {nb_pages} pages")
              except Exception as e:
                  print(f"  Failed: {e}")
                  continue

              if nb_pages == 0:
                  continue

              for i in range(0, nb_pages, PAGES_PER_JOB):
                  start = i
                  end = min(i + PAGES_PER_JOB - 1, nb_pages - 1)
                  matrix["include"].append({
                      "category": category_name,
                      "start": start,
                      "end": end
                  })

          print(f"Total jobs: {len(matrix['include'])}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
          EOF

  scrape:
    runs-on: ubuntu-latest
    needs: detect_pages
    strategy:
      matrix: ${{ fromJson(needs.detect_pages.outputs.matrix) }}
      max-parallel: 5
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper with retry
        run: |
          python -u main.py "${{ matrix.category }}" ${{ matrix.start }} ${{ matrix.end }}

      - name: Upload raw data artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.category }}-${{ matrix.start }}-${{ matrix.end }}
          path: |
            ${{ matrix.category }}_${{ matrix.start }}_${{ matrix.end }}.jsonl
            ${{ matrix.category }}_${{ matrix.start }}_${{ matrix.end }}_failed.txt
            ${{ matrix.category }}_${{ matrix.start }}_${{ matrix.end }}_result.json
            request_stats_${{ matrix.start }}_${{ matrix.end }}.json
          if-no-files-found: ignore

  detect_merge_batches:
    runs-on: ubuntu-latest
    needs: scrape
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        run: |
          python << 'EOF'
          import json
          import os
          import math
          import requests

          URL = "https://wd0ptz13zs-dsn.algolia.net/1/indexes/*/queries"
          PARAMS = {
              "x-algolia-agent": "Algolia for JavaScript (4.24.0); Browser (lite)",
              "x-algolia-api-key": "cdd839b4fdac840289e88633779e8634",
              "x-algolia-application-id": "WD0PTZ13ZS",
          }

          CATEGORIES = {
              "rent_residential": {"index": "property-for-rent-residential.com", "filter": '("category_v2.slug_paths":"property-for-rent/residential")'},
              "rent_rooms_rent_flatmates": {"index": "property-for-rent-rooms-for-rent-flatmates.com", "filter": '("category_v2.slug_paths":"property-for-rent/rooms-for-rent-flatmates")'},
              "rent_commercial": {"index": "property-for-rent-commercial.com", "filter": '("category_v2.slug_paths":"property-for-rent/commercial")'},
              "rent_holiday_homes": {"index": "property-for-rent-holiday-homes.com", "filter": '("categories.slug_paths":"property-for-rent/holiday-homes")'},
              "rent_short_term_monthly": {"index": "property-for-rent-short-term.com", "filter": '("categories_v2.slug_paths":"property-for-rent/short-term")', "hits": []},
              "rent_short_term_daily": {"index": "property-for-rent-short-term-daily.com", "filter": '("category_v2.slug_paths":"property-for-rent/short-term-daily")'},
          
          }

          ROWS_PER_BATCH = 2000
          HITS_PER_PAGE = 35
          PAGES_PER_BATCH = math.ceil(ROWS_PER_BATCH / HITS_PER_PAGE)

          matrix = {"include": []}

          for category_name, category in CATEGORIES.items():
              try:
                  payload = {
                      "requests": [{
                          "indexName": category["index"],
                          "query": "",
                          "params": f"page=0&hitsPerPage={HITS_PER_PAGE}&filters={category['filter']}",
                      }]
                  }
                  r = requests.post(URL, params=PARAMS, json=payload, timeout=30)
                  data = r.json()
                  nb_pages = data["results"][0]["nbPages"]
              except Exception as e:
                  print(f"  Failed to detect pages for {category_name}: {e}")
                  continue

              if nb_pages == 0:
                  continue
              nb_pages = 20
              n_batches = math.ceil(nb_pages / PAGES_PER_BATCH)
              print(f"{category_name}: {nb_pages} pages -> {n_batches} batches")

              for b in range(n_batches):
                  page_start = b * PAGES_PER_BATCH
                  page_end = min((b + 1) * PAGES_PER_BATCH - 1, nb_pages - 1)
                  matrix["include"].append({
                      "category": category_name,
                      "batch_index": str(b),
                      "page_start": str(page_start),
                      "page_end": str(page_end)
                  })

          print(f"Total merge batches: {len(matrix['include'])}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
          EOF

  merge_batch:
    runs-on: ubuntu-latest
    needs: detect_merge_batches

    strategy:
      max-parallel: 10
      fail-fast: false
      matrix: ${{ fromJson(needs.detect_merge_batches.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl boto3 requests pillow python-dotenv playwright playwright-stealth

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Download raw data for ${{ matrix.category }}
        uses: actions/download-artifact@v4
        with:
          pattern: raw-${{ matrix.category }}-*
          merge-multiple: true
          path: raw_parts/

      - name: Process batch (no R2 upload yet)
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python << 'EOF'
          import glob
          import re
          import shutil
          import pandas as pd
          from dub_writer import process_category

          category = "${{ matrix.category }}"
          page_start = int("${{ matrix.page_start }}")
          page_end = int("${{ matrix.page_end }}")

          all_jsonl = glob.glob('raw_parts/*.jsonl')
          batch_jsonl = []
          for f in all_jsonl:
              match = re.search(r'_(\d+)_(\d+)\.jsonl$', f)
              if match:
                  s, e = int(match.group(1)), int(match.group(2))
                  if s <= page_end and e >= page_start:
                      batch_jsonl.append(f)

          print(f"Batch {category} [{page_start}-{page_end}]: {len(batch_jsonl)} raw files")

          if not batch_jsonl:
              print("No data for this batch, skipping.")
              exit(0)

          output_base = "output"
          result = process_category(category, batch_jsonl, output_base, upload_images=False, enrich_contact_details=True)
          print(f"Batch processed: {result['total']} rows | {len(result['excel_files'])} excel files")

          if not result["excel_files"]:
            print("No output files generated. Skipping batch.")
            exit(0)

          # Copy request stats and failed pages for final summary aggregation
          for stats_file in glob.glob('raw_parts/request_stats_*.json'):
              m = re.search(r'request_stats_(\d+)_(\d+)\.json$', stats_file)
              if m:
                  s, e = int(m.group(1)), int(m.group(2))
                  if s <= page_end and e >= page_start:
                      shutil.copy(stats_file, f"output/request_stats_{page_start}_{page_end}.json")

          for failed_file in glob.glob('raw_parts/*_failed.txt'):
              m = re.search(r'_(\d+)_(\d+)_failed\.txt$', failed_file)
              if m:
                  s, e = int(m.group(1)), int(m.group(2))
                  if s <= page_end and e >= page_start:
                      shutil.copy(failed_file, f"output/failed_pages_{page_start}_{page_end}.txt")
          EOF

      - name: Upload batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ matrix.category }}-${{ matrix.batch_index }}
          path: output/
          if-no-files-found: ignore

  final_merge:
    runs-on: ubuntu-latest
    needs: merge_batch

    strategy:
      max-parallel: 10
      matrix:
        category:
          - rent_residential
          - rent_rooms_rent_flatmates
          - rent_commercial
          - rent_holiday_homes
          - rent_short_term_daily
          - rent_short_term_monthly

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl boto3

      - name: Download all batches for ${{ matrix.category }} (separate folders)
        uses: actions/download-artifact@v4
        with:
          pattern: batch-${{ matrix.category }}-*
          path: batches/

      - name: Get workflow duration
        id: workflow_duration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARTED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)
          START_TIMESTAMP=$(date -d "$STARTED_AT" +%s)
          NOW_TIMESTAMP=$(date -u +%s)
          DURATION_SEC=$((NOW_TIMESTAMP - START_TIMESTAMP))
          echo "start_time=$START_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "duration_sec=$DURATION_SEC" >> "$GITHUB_OUTPUT"
          echo "Workflow started at: $STARTED_AT"
          echo "Workflow duration: ${DURATION_SEC}s"

      - name: Combine batches and upload to R2
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          WORKFLOW_DURATION: ${{ steps.workflow_duration.outputs.duration_sec }}
        run: |
          python << 'EOF'
          import glob
          import os
          import json
          import boto3
          import pandas as pd
          from datetime import datetime
          from collections import defaultdict

          category = "${{ matrix.category }}"
          dt = datetime.now()
          date_prefix = f"year={dt.year}/month={dt.strftime('%m')}/day={dt.strftime('%d')}"

          client = boto3.client('s3',
              endpoint_url=os.environ['CF_R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['CF_R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['CF_R2_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          bucket = os.environ['CF_R2_BUCKET_NAME']

          batch_dirs = glob.glob(f'batches/batch-{category}-*')

          if not batch_dirs:
            print(f"No batches found for {category}, skipping upload.")
            exit(0)

          excel_groups = defaultdict(list)

          for batch_dir in batch_dirs:
              for root, dirs, files in os.walk(batch_dir):
                  for file in files:
                      if file.endswith('.xlsx'):
                          full_path = os.path.join(root, file)
                          relative_path = os.path.relpath(full_path, batch_dir)
                          excel_groups[relative_path].append(full_path)

          print(f"Found {len(excel_groups)} unique file groups to combine")

          total_rows_all = 0
          uploaded_count = 0

          for relative_path, batch_files in excel_groups.items():
              combined_sheets = defaultdict(list)

              for bf in batch_files:
                  xl = pd.ExcelFile(bf)
                  for sheet in xl.sheet_names:
                      df = xl.parse(sheet)
                      combined_sheets[sheet].append(df)

              final_sheets = {}
              for sheet_name, dfs in combined_sheets.items():
                  merged_df = pd.concat(dfs, ignore_index=True)
                  if 'id' in merged_df.columns:
                      merged_df = merged_df.drop_duplicates(subset=['id'], keep='first')
                  final_sheets[sheet_name] = merged_df
                  total_rows_all += len(merged_df)

              local_final_path = os.path.join("final_output", relative_path)
              os.makedirs(os.path.dirname(local_final_path), exist_ok=True)

              with pd.ExcelWriter(local_final_path, engine="openpyxl") as writer:
                  for sheet_name, df in final_sheets.items():
                      df.to_excel(writer, sheet_name=sheet_name, index=False)

              json_relative = relative_path.replace('/excel/', '/json/').replace('.xlsx', '.json')
              local_json_path = os.path.join("final_output", json_relative)
              os.makedirs(os.path.dirname(local_json_path), exist_ok=True)

              all_records = []
              for sheet_name, df in final_sheets.items():
                  records = df.to_dict(orient="records")
                  for r in records:
                      r["_sheet"] = sheet_name
                  all_records.extend(records)

              with open(local_json_path, "w", encoding="utf-8") as f:
                  json.dump(all_records, f, ensure_ascii=False, indent=2, default=str)

              r2_key_excel = f"DUAE/{date_prefix}/{relative_path.replace(os.sep, '/')}"
              client.upload_file(local_final_path, bucket, r2_key_excel,
                  ExtraArgs={'ContentType': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})
              print(f"Uploaded Excel: {r2_key_excel}")

              r2_key_json = f"DUAE/{date_prefix}/{json_relative.replace(os.sep, '/')}"
              client.upload_file(local_json_path, bucket, r2_key_json,
                  ExtraArgs={'ContentType': 'application/json; charset=utf-8'})
              print(f"Uploaded JSON: {r2_key_json}")

              uploaded_count += 1

          # REQUEST STATS
          def aggregate_request_stats(paths: list) -> dict:
              total_requests = 0
              total_duration_min = 0.0
              for p in paths:
                  try:
                      with open(p, 'r', encoding='utf-8') as fh:
                          s = json.load(fh)
                      total_requests += s.get('total_requests', 0)
                      total_duration_min += s.get('total_duration_min', 0) or 0
                  except Exception as e:
                      print(f"Could not read {p}: {e}")
              requests_per_min = round(total_requests / total_duration_min, 2) if total_duration_min > 0 else total_requests
              return {
                  "requests_total": total_requests,
                  "duration_sec": round(total_duration_min * 60, 2),
                  "requests_per_min": requests_per_min,
              }

          stats_files = []
          for batch_dir in batch_dirs:
              stats_files.extend(glob.glob(os.path.join(batch_dir, "request_stats_*.json")))

          request_metrics = aggregate_request_stats(stats_files)
          print(f"Request metrics for {category}: {request_metrics['requests_total']} req, "
                f"{request_metrics['requests_per_min']} req/min, {request_metrics['duration_sec']}s")

          # FAILED PAGES
          all_failed_pages = []
          total_pages_all = 0

          for batch_dir in batch_dirs:
              for failed_txt in glob.glob(os.path.join(batch_dir, "failed_pages_*.txt")):
                  with open(failed_txt, 'r', encoding='utf-8') as f:
                      lines = f.readlines()
                  for line in lines:
                      line = line.strip()
                      if line.startswith("page="):
                          page_num = line.replace("page=", "")
                          all_failed_pages.append({
                              "category": category,
                              "page": page_num,
                              "error": "Failed after retries"
                          })

              for result_json in glob.glob(os.path.join(batch_dir, "*_result.json")):
                  try:
                      with open(result_json, 'r', encoding='utf-8') as f:
                          info = json.load(f)
                      total_pages_all += info.get("total_pages", 0)
                  except Exception:
                      pass

          total_failed = len(all_failed_pages)
          failed_pct = round(total_failed / total_pages_all * 100, 2) if total_pages_all > 0 else 0

          # Build failed_items for summary
          failed_items = []
          for fp in all_failed_pages:
              failed_items.append({
                  "name": f"{fp['category']}-page-{fp['page']}",
                  "errors": 1,
                  "detail": fp["error"]
              })

          # Format failed_items_summary
          def format_failed_summary(failed_items: list, max_len: int = 400) -> str | None:
              if not failed_items:
                  return None
              parts = []
              for item in failed_items[:12]:
                  name = item.get("name", "?")
                  count = item.get("errors", 0)
                  detail = item.get("detail", "")
                  bit = f"{name}: {count} error(s)"
                  if detail:
                      bit += f" ({detail})"
                  parts.append(bit)
              text = "; ".join(parts)
              if len(failed_items) > 12:
                  text += f"; +{len(failed_items) - 12} more"
              return text[:max_len]

          failed_items_summary = format_failed_summary(failed_items)

          # Calculate error_rate_pct
          if request_metrics["requests_total"] > 0:
              request_metrics["requests_failed"] = total_failed
              request_metrics["error_rate_pct"] = round(total_failed / request_metrics["requests_total"] * 100, 2)
          else:
              request_metrics["requests_failed"] = total_failed
              request_metrics["error_rate_pct"] = None

          # Add workflow total duration (from GitHub Actions)
          workflow_duration = os.getenv("WORKFLOW_DURATION")
          if workflow_duration:
              try:
                  request_metrics["workflow_duration_sec"] = float(workflow_duration)
              except ValueError:
                  request_metrics["workflow_duration_sec"] = None
          else:
              request_metrics["workflow_duration_sec"] = None

          failed_data = {
              "category": category,
              "total_pages_attempted": total_pages_all,
              "total_failed": total_failed,
              "failed_percentage": failed_pct,
              "failed_pages": all_failed_pages,
          }

          # UPLOAD summary.json (contains request_metrics + failed_items inside)
          summary_hierarchy_groups = set()
          for relative_path in excel_groups.keys():
              parts = relative_path.replace(os.sep, '/').split('/')
              hierarchy = "/".join(parts[:-2])
              summary_hierarchy_groups.add(hierarchy)

          summary_by_group = {}
          for batch_dir in batch_dirs:
              for summary_file in glob.glob(os.path.join(batch_dir, "**", "summary.json"), recursive=True):
                  rel = os.path.relpath(summary_file, batch_dir)
                  hierarchy = os.path.dirname(os.path.dirname(rel)).replace(os.sep, '/')
                  with open(summary_file, 'r', encoding='utf-8') as f:
                      s = json.load(f)
                  agg = summary_by_group.setdefault(hierarchy, {
                      "scraped_at": s["scraped_at"],
                      "data_scraped_date": s["data_scraped_date"],
                      "saved_to_R2_date": s["saved_to_R2_date"],
                      "category": s.get("category", ""),
                      "total_listings": 0,
                      "subcats": {},
                  })
                  agg["total_listings"] += s.get("total_listings", 0)
                  for sc in s.get("subcategories", []):
                      key = sc["slug"]
                      if key in agg["subcats"]:
                          agg["subcats"][key]["listings_count"] += sc["listings_count"]
                      else:
                          agg["subcats"][key] = dict(sc)

          for hierarchy, agg in summary_by_group.items():
              summary_data = {
                  "scraped_at": agg["scraped_at"],
                  "data_scraped_date": agg["data_scraped_date"],
                  "saved_to_R2_date": agg["saved_to_R2_date"],
                  "category": agg["category"],
                  "workflow_name": "Rent Property",
                  "total_subcategories": len(agg["subcats"]),
                  "total_listings": agg["total_listings"],
                  "subcategories": list(agg["subcats"].values()),
                  "request_metrics": request_metrics,
                  "failed_items": failed_items,
                  "failed_items_summary": failed_items_summary,
              }
              r2_key = f"DUAE/{date_prefix}/{hierarchy}/summary/summary.json"
              client.put_object(Bucket=bucket, Key=r2_key, Body=json.dumps(summary_data, ensure_ascii=False, indent=2).encode('utf-8'),
                               ContentType='application/json; charset=utf-8')
              print(f"Uploaded summary: {r2_key}")

          print(f"\nDONE: {uploaded_count} files uploaded for {category} | Total rows: {total_rows_all}")
          EOF